name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'BenchmarkDotNet job (short for smoke, default for publishable numbers)'
        required: false
        default: 'short'

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Penghou.Hetu.slnx
      - name: Run benchmarks
        run: dotnet run -c Release --no-restore --project benchmarks/Penghou.Hetu.Benchmarks -- --job ${{ inputs.job }} --filter *LatticeStoreBenchmarks*
      - name: Run extraction benchmarks
        run: dotnet run -c Release --no-restore --project benchmarks/Penghou.Hetu.Benchmarks -- --job ${{ inputs.job }} --filter *ExtractionBenchmarks*
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/
