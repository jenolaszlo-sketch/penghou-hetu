name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Penghou.Hetu.slnx
      - run: dotnet format Penghou.Hetu.slnx --verify-no-changes --no-restore
      - run: dotnet test Penghou.Hetu.slnx -c Release --no-restore

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Penghou.Hetu.slnx
      - run: dotnet pack Penghou.Hetu.slnx -c Release --no-restore --output artifacts/packages
